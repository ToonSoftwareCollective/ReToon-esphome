# ReToon OpenTherm module: an ESP with an OpenTherm master adapter at the
# boiler, instead of the Toon's boiler module and its cable. The Toon keeps
# doing the thermostat work (ReToon's toon-boilerd) and talks to this ESP
# over the ESPHome native API, encrypted with the key ReToon made.
#
# Used as a package from the short configuration ReToon's web interface
# makes (Thermostat tab, "Boiler connection"), which sets the board and:
#
#   substitutions:
#     name: retoon-opentherm     device name (also <name>.local)
#     in_pin: GPIO4              the adapter's line from the boiler
#     out_pin: GPIO5             the adapter's line to the boiler
#     api_key: "..."             made by ReToon, 32 bytes base64
#     ota_password: "..."        made by ReToon
#
# Control is the Toon's: it writes the heating switch and the flow setpoint
# every minute. When that stops for five minutes (Toon off, WiFi gone) this
# ESP stops asking for heat by itself; hot water and the boiler's own frost
# protection keep working. The hot water setpoint and the maximum flow
# temperature are only read: OpenTherm here writes what it controls in every
# round, and boilers keep those two in memory that wears out.
#
# Adding this ESP to Home Assistant as well is fine for watching; the Toon
# overwrites a change made there within a minute.

substitutions:
  friendly_name: ReToon OpenTherm
  failsafe_minutes: "5"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.6.0
  project:
    name: retoon.opentherm
    version: "1.0"

logger:

api:
  encryption:
    key: ${api_key}
  # the Toon may be away for a while (a restart, an update): no reboots
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: ${ota_password}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # a wrong WiFi setting can be fixed without a cable
  ap:
    ssid: ${name}

captive_portal:

# when the Toon last set the flow setpoint (its heartbeat)
globals:
  - id: retoon_last_seen
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: retoon_failsafe
    type: bool
    restore_value: false
    initial_value: "false"

opentherm:
  id: retoon_ot
  in_pin: ${in_pin}
  out_pin: ${out_pin}

switch:
  - platform: opentherm
    ch_enable:
      id: retoon_ch_enable
      name: Heating
      # no heat request until the Toon asks
      restore_mode: ALWAYS_OFF
    dhw_enable:
      id: retoon_dhw_enable
      name: Hot water
      restore_mode: ALWAYS_ON

number:
  - platform: opentherm
    t_set:
      id: retoon_t_set
      name: Flow setpoint
      min_value: 0
      max_value: 90
      step: 0.5
      initial_value: 0
      restore_value: false
      on_value:
        - lambda: |-
            id(retoon_last_seen) = millis();
            id(retoon_failsafe) = false;
    t_room_set:
      name: Room setpoint
      min_value: 0
      max_value: 30
      step: 0.1
      initial_value: 0
      restore_value: false
    t_room:
      name: Room temperature
      min_value: -20
      max_value: 50
      step: 0.1
      initial_value: 0
      restore_value: false

sensor:
  - platform: opentherm
    t_boiler:
      name: Boiler water
    t_ret:
      name: Return water
    rel_mod_level:
      name: Modulation
    ch_pressure:
      name: Water pressure
    t_dhw:
      name: Hot water temperature
    dhw_flow_rate:
      name: Hot water flow
    t_outside:
      name: Outside temperature
    t_exhaust:
      name: Exhaust temperature
    t_dhw_set:
      name: Hot water setpoint
    max_t_set:
      name: Maximum flow setpoint
    t_dhw_set_ub:
      name: Hot water setpoint upper limit
    t_dhw_set_lb:
      name: Hot water setpoint lower limit
    fan_speed:
      name: Fan speed
    fan_speed_setpoint:
      name: Fan speed setpoint
    flame_current:
      name: Flame current
    burner_starts:
      name: Burner starts
    ch_pump_starts:
      name: Heating pump starts
    dhw_pump_valve_starts:
      name: Hot water pump starts
    dhw_burner_starts:
      name: Hot water burner starts
    burner_operation_hours:
      name: Burner hours
    ch_pump_operation_hours:
      name: Heating pump hours
    dhw_pump_valve_operation_hours:
      name: Hot water pump hours
    dhw_burner_operation_hours:
      name: Hot water burner hours
    opentherm_version_device:
      name: Boiler OpenTherm version
    device_type:
      name: Boiler product type
    device_version:
      name: Boiler product version

binary_sensor:
  - platform: opentherm
    fault_indication:
      name: Fault
    ch_active:
      name: Heating active
    dhw_active:
      name: Hot water active
    flame_on:
      name: Flame
    diagnostic_indication:
      name: Diagnostic
    dhw_present:
      name: Has hot water
    control_type_on_off:
      name: On/off control type
    service_request:
      name: Service request
    lockout_reset:
      name: Lockout reset possible
    low_water_pressure:
      name: Low water pressure
    flame_fault:
      name: Flame fault
    air_pressure_fault:
      name: Air pressure fault
    water_over_temp:
      name: Water over temperature

# no word from the Toon for a while: no heat request (hot water stays)
interval:
  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              return !id(retoon_failsafe) &&
                     millis() - id(retoon_last_seen) > ${failsafe_minutes} * 60000UL &&
                     (id(retoon_ch_enable).state || id(retoon_t_set).state > 0);
          then:
            - logger.log:
                level: WARN
                format: "No word from the Toon for ${failsafe_minutes} minutes: heating request off"
            - switch.turn_off: retoon_ch_enable
            - number.set:
                id: retoon_t_set
                value: 0
            - lambda: |-
                id(retoon_failsafe) = true;
